# Render Blueprint: in Render, New → Blueprint → pick this repo (see docs/DESPLIEGUE.md)
services:
  - type: web
    name: besound-api
    runtime: docker
    plan: free
    region: frankfurt
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DATABASE_URL          # Neon connection string
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ENDPOINT_URL       # https://<account id>.r2.cloudflarestorage.com
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_DOMAIN      # pub-xxxx.r2.dev (without https://)
        sync: false
